# TE 578/778 - Lab 3: load-balancer VNF (vLB) configuration
# Topology: see lab03/topology.md, diagram "Lab 3 - service chain".
worker_processes 1;
events { worker_connections 1024; }

http {
    log_format chain '$remote_addr -> $upstream_addr "$request" $status '
                     'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout chain;

    upstream web_pool {
        # round-robin by default; try "least_conn;" or "ip_hash;" in Part E
        server web1:80 max_fails=1 fail_timeout=10s;
        server web2:80 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://web_pool;
            proxy_connect_timeout 2s;
            add_header X-Chain    "vFW -> vLB -> $upstream_addr" always;
        }

        location /lb-status {          # simple VNF telemetry endpoint
            stub_status;
        }
    }
}
